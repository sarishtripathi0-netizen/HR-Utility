openapi: 3.1.0
info:
  title: Sewa Setu 2.0 — HR Utility (PoC)
  description: "\n**Sewa Setu 2.0 — HR Utility (PoC).** Answers: *who sits in which chair, holding which functions, as of\
    \ any time.*\n\n* Every read accepts `?at=` (ISO-8601; naive = IST; date = 00:00 IST). Default: now.\n* Timestamps are\
    \ returned in Asia/Kolkata (+05:30). Every officer object carries `is_demo`.\n* Business-rule refusals return **409**\
    \ `{\"error\": {\"rule\": \"BR-xx\", \"message\": \"...\"}}`.\n* Offices, office types, designations and holidays come\
    \ from the **MDM PoC**; every response carries\n  `X-MDM-Source`, `X-MDM-Version` and `X-MDM-Synced-At` (freshness of\
    \ that copy).\n* The IAM endpoints are a **stub** with no authentication.\n* Nothing is ever deleted: ends and corrections\
    \ write a new row and keep the old one (BR-10).\n\nReference: `docs/api.md` (endpoints with examples) and `docs/integration.md`\
    \ (how each consumer calls this service).\n"
  contact:
    name: Sewa Setu 2.0 — HR Utility PoC team
  version: 0.3.0
paths:
  /v1/seat-holders:
    get:
      tags:
      - Rule Engine
      summary: Who holds post P with function F in office O at time t, and the Link Officer if none is available
      operationId: seat_holders_v1_seat_holders_get
      parameters:
      - name: office_id
        in: query
        required: true
        schema:
          type: string
          description: MDM office code
          examples:
          - DC_NGN
          title: Office Id
        description: MDM office code
      - name: post_code
        in: query
        required: true
        schema:
          type: string
          description: MDM designation code or short name
          examples:
          - ADC
          title: Post Code
        description: MDM designation code or short name
      - name: function_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Required unless roster mode is on
          examples:
          - SOCIAL_WELFARE
          title: Function Code
        description: Required unless roster mode is on
      - name: at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 timestamp or date; naive values are IST; default now
          examples:
          - '2026-11-04T10:00:00+05:30'
          title: At
        description: ISO-8601 timestamp or date; naive values are IST; default now
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatHoldersResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
