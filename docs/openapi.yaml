components:
  schemas:
    AbsentHolder:
      properties:
        employee_id:
          type: string
          title: Employee Id
        name:
          type: string
          title: Name
        cadre:
          anyOf:
          - type: string
          - type: 'null'
          title: Cadre
        year_of_joining:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year Of Joining
        is_demo:
          type: boolean
          title: Is Demo
        unavailable_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Unavailable Reason
      type: object
      required:
      - employee_id
      - name
      - cadre
      - year_of_joining
      - is_demo
      - unavailable_reason
      title: AbsentHolder
    AllotBody:
      properties:
        employee_id:
          type: string
          title: Employee Id
        office_id:
          type: string
          title: Office Id
        function_code:
          type: string
          title: Function Code
        effective_from:
          type: string
          title: Effective From
        effective_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Effective To
        entered_by:
          type: string
          title: Entered By
          description: Must be the Establishment branch of office_id, e.g. ESTB@DCO-27NAL
      type: object
      required:
      - employee_id
      - office_id
      - function_code
      - effective_from
      - entered_by
      title: AllotBody
      examples:
      - effective_from: '2026-11-04T10:00:00+05:30'
