tags:
- name: Rule Engine
  description: 'The core question: who holds post P with function F in office O at time t, are they available, and if not,
    who is the Link Officer (BR-06, BR-07, BR-08).'
- name: IAM
  description: Posts an officer holds at time t (substantive, additional, link charge) — what IAM offers the officer to act
    as.
- name: Workflow
  description: 'Office roster: every chair, its holders, their functions and availability.'
- name: Establishment
  description: 'Writes by the Establishment branch: onboarding (BR-09), joining and relieving (BR-01..03), function allotment
    (BR-04), leave and tour (BR-06), declare vacant. Refusals return 409 with the rule number.'
- name: Records
