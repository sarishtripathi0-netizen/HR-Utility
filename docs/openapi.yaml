        description: Chair ID `<office>-<designation>-NN`
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Start (a date means 00:00 IST)
          examples:
          - '2026-10-01'
          title: From
        description: Start (a date means 00:00 IST)
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'End (a date is inclusive: up to 24:00 IST that day)'
          examples:
          - '2026-10-31'
          title: To
        description: 'End (a date is inclusive: up to 24:00 IST that day)'
      responses:
        '200':
          description: Successful Response
          content:
