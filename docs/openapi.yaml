          type: integer
          title: Lineage Id
        employee_id:
          type: string
          title: Employee Id
        is_demo:
          type: boolean
          title: Is Demo
          description: True for demo allotments or demo officers
        office_id:
          type: string
          title: Office Id
        function_code:
          type: string
          title: Function Code
        effective_from:
          type: string
          title: Effective From
        effective_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Effective To
        entered_by:
          type: string
          title: Entered By
      type: object
      required:
      - id
      - lineage_id
      - employee_id
      - is_demo
      - office_id
      - function_code
      - effective_from
      - effective_to
      - entered_by
      title: AllotOut
